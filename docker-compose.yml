# Lancer TextileCycle avec l'image publiée sur Docker Hub, et une base MySQL.
#   1. Remplacer « mehdi002 » par le compte Docker Hub du projet si besoin
#   2. docker compose up -d       → http://localhost:8080
#   3. Données de démo (une fois) : docker compose exec app php artisan db:seed --force
services:
  app:
    image: ${DOCKERHUB_USERNAME:-mehdi002}/textilecycle:latest
    ports:
      - "8080:80"
    environment:
      APP_NAME: TextileCycle
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Définissez APP_KEY (php artisan key:generate --show)}
      APP_URL: http://localhost:8080
      APP_LOCALE: fr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: textilecycle
      DB_USERNAME: textilecycle
      DB_PASSWORD: textilecycle
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      RUN_MIGRATIONS: "true"
      # Clés facultatives des fonctionnalités IA (sans elles, l'application fonctionne sans IA)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: textilecycle
      MYSQL_USER: textilecycle
      MYSQL_PASSWORD: textilecycle
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - donnees-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

volumes:
  donnees-mysql:
