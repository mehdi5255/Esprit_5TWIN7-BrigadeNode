# Pipeline DevOps de TextileCycle
#   CI : style du code → tests automatisés → analyse de qualité SonarCloud
#   CD : construction et publication de l'image Docker sur Docker Hub (branche main uniquement)
name: CI/CD TextileCycle

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Un nouveau push annule le pipeline encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: 1. Style du code (Laravel Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Vérifier le style (standard Laravel)
        run: vendor/bin/pint --test

  tests:
    name: 2. Tests automatisés (Pest)
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.2 (avec la couverture de code)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, zip, exif, bcmath
          tools: composer:v2
          coverage: pcov

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      # Base SQLite en mémoire (phpunit.xml) ; Gemini, Cloudflare, e-mails et cartes sont simulés.
      - name: Lancer les tests et mesurer la couverture
        run: vendor/bin/pest --coverage-clover=coverage.xml --log-junit=tests-junit.xml

      - name: Conserver les rapports pour SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            coverage.xml
            tests-junit.xml

  sonarcloud:
    name: 3. Analyse de qualité (SonarCloud)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (historique complet pour SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer les rapports des tests
        uses: actions/download-artifact@v4
        with:
          name: rapports-tests

      - name: Analyser le code
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: 4. Image Docker sur Docker Hub (CD)
    needs: [tests, sonarcloud]
    # Déploiement continu : seulement quand main évolue (après fusion d'une Pull Request).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Définir les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/textilecycle
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement:
    name: 5. Mise en ligne sur Render (CD)
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Demander à Render de déployer la nouvelle image
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL absent : déploiement ignoré."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Déploiement demandé à Render."

      - name: 6. Vérifier que le site public répond
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::Variable SITE_URL absente : vérification ignorée."
            exit 0
          fi
          # Render redémarre le service (et recrée les données de démo) : on attend jusqu'à 10 minutes.
          sleep 60
          for essai in $(seq 1 30); do
            if curl -fsS --max-time 30 "$SITE_URL/up" > /dev/null && curl -fsS --max-time 30 "$SITE_URL/" | grep -q "TextileCycle"; then
              echo "Site en ligne : $SITE_URL"
              exit 0
            fi
            echo "Pas encore prêt (essai $essai/30)…"
            sleep 20
          done
          echo "::error::Le site $SITE_URL ne répond pas."
          exit 1
