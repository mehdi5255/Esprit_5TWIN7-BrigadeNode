# Analyse de qualité SonarCloud (lancée par le pipeline GitHub Actions)
# Clé et organisation : celles affichées par SonarCloud après l'import du dépôt.
sonar.projectKey=mehdi5255_Esprit_5TWIN7-BrigadeNode
sonar.organization=mehdi5255
sonar.projectName=TextileCycle

# Code analysé
sonar.sources=app,routes,database,resources/views,config
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/**
sonar.sourceEncoding=UTF-8

# Couverture de code produite par les tests Pest (format Clover)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=tests-junit.xml
# Seul le code PHP de l'application compte dans la couverture (pas les vues, migrations, seeders ni la configuration)
sonar.coverage.exclusions=resources/views/**,database/**,config/**,routes/**
